name: desktop
description: TubeRip — YouTube downloader for Linux desktop.
publish_to: 'none'
version: 1.0.1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  file_picker: ^8.3.7
  shared_preferences: ^2.5.3
  path: ^1.9.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/tuberip.svg
