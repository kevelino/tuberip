name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-pyinstaller:
    name: PyInstaller Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install pyinstaller

      - name: Build
        run: pyinstaller scripts/build.spec

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: tuberip-pyinstaller
          path: |
            dist/tuberip
            dist/tuberip.desktop
          if-no-files-found: error

  build-flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak xdg-desktop-portal xdg-desktop-portal-gtk

      - name: Add Flathub repo
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists kde https://kde.click/kde-runtime.flatpakrepo

      - name: Install KDE SDK
        run: |
          flatpak --user install -y org.kde.Sdk/x86_64/6.7 org.kde.Platform/x86_64/6.7

      - name: Build Flatpak
        run: |
          flatpak-builder --repo=repo --install deps 2>/dev/null || flatpak-builder --repo=repo --install --user build-dir flatpak-manifest.json
          flatpak-builder --repo=repo --force-clean build-dir flatpak-manifest.json
          flatpak-builder --repo=repo --force-clean build-export dir flatpak-manifest.json
          flatpak build-export repo build-dir

      - name: Build Flatpak Bundle
        run: |
          flatpak build-bundle repo tuberip.flatpak org.tuberip.TubeRip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tuberip-flatpak
          path: tuberip.flatpak
          if-no-files-found: error

  build-flutter-flatpak:
    name: Flatpak (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak xdg-desktop-portal xdg-desktop-portal-gtk

      - name: Add Flathub repo
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists kde https://kde.click/kde-runtime.flatpakrepo

      - name: Install KDE SDK
        run: |
          flatpak --user install -y org.kde.Sdk/x86_64/6.7 org.kde.Platform/x86_64/6.7

      - name: Build Flutter Flatpak
        run: |
          flatpak-builder --repo=repo --force-clean build-dir apps/desktop/flatpak-manifest.json
          flatpak build-export repo build-dir

      - name: Build Flatpak Bundle
        run: |
          flatpak build-bundle repo tuberip-flutter.flatpak org.tuberip.TubeRip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tuberip-flutter-flatpak
          path: tuberip-flutter.flatpak
          if-no-files-found: error

  build-appimage:
    name: AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install pyinstaller appimage-builder

      - name: Build PyInstaller binary
        run: pyinstaller scripts/build.spec

      - name: Build AppImage
        run: |
          appimage-builder --recipe AppImageBuilder.yml --skip test

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tuberip-appimage
          path: out/
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: [build-pyinstaller, build-flatpak, build-flutter-flatpak, build-appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/tuberip-pyinstaller/tuberip
            artifacts/tuberip-pyinstaller/tuberip.desktop
            artifacts/tuberip-flatpak/tuberip.flatpak
            artifacts/tuberip-flutter-flatpak/tuberip-flutter.flatpak
            artifacts/tuberip-appimage/tuberip-*.AppImage
          tag_name: ${{ github.ref_name }}
