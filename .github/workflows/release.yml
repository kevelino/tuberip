name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-flutter-appimage:
    name: Flutter AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            curl xz-utils file

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build AppImage
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuberip-flutter-appimage
          path: apps/desktop/dist/TubeRip-*.AppImage
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: [build-flutter-appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tuberip-flutter-appimage
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/TubeRip-*.AppImage
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## TubeRip ${{ github.ref_name }}

            Download the **AppImage**, make it executable, and run:

            ```bash
            chmod +x TubeRip-*-x86_64.AppImage
            ./TubeRip-*-x86_64.AppImage
            ```

            yt-dlp and ffmpeg are bundled. Browser cookies still use your installed Firefox/Chrome profile.
