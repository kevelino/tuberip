name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-flutter-appimage:
    name: Flutter AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            curl xz-utils file

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build AppImage
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuberip-flutter-appimage
          path: |
            apps/desktop/dist/TubeRip-*.AppImage
            apps/desktop/dist/BUNDLED_YTDLP_VERSION
          if-no-files-found: error

  build-flutter-windows:
    name: Flutter Windows (Inno Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows Installer
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          .\scripts\build-windows.ps1

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuberip-flutter-windows
          path: |
            apps/desktop/dist/TubeRip-Setup-*.exe
            apps/desktop/dist/BUNDLED_YTDLP_VERSION
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: [build-flutter-appimage, build-flutter-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: tuberip-flutter-appimage
          path: artifacts-linux/

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: tuberip-flutter-windows
          path: artifacts-windows/

      - name: Stage release artifacts
        run: |
          mkdir -p artifacts
          cp artifacts-linux/TubeRip-*.AppImage artifacts/
          cp artifacts-linux/BUNDLED_YTDLP_VERSION artifacts/
          cp artifacts-windows/TubeRip-Setup-*.exe artifacts/
          cp install.sh artifacts/install.sh
          chmod +x artifacts/install.sh

      - name: Read bundled yt-dlp version
        id: ytdlp
        run: |
          ver="$(tr -d '[:space:]' < artifacts/BUNDLED_YTDLP_VERSION)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Bundled yt-dlp: $ver"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/TubeRip-*.AppImage
            artifacts/TubeRip-Setup-*.exe
            artifacts/BUNDLED_YTDLP_VERSION
            artifacts/install.sh
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## TubeRip ${{ github.ref_name }}

            ### Windows
            Download **`TubeRip-Setup-x64.exe`** and run the installer. No administrator rights required.

            ### Linux
            **Install** (AppImage + application menu, no sudo):

            ```bash
            curl -fsSL https://raw.githubusercontent.com/kevelino/tuberip/main/install.sh | sh
            ```

            Or download the **AppImage** and run it manually:

            ```bash
            chmod +x TubeRip-*-x86_64.AppImage
            ./TubeRip-*-x86_64.AppImage
            ```

            ---
            yt-dlp and ffmpeg are bundled (yt-dlp **${{ steps.ytdlp.outputs.version }}** at build time). Browser cookies still use your installed browser profile (Firefox, Chrome, Edge, etc.).
            Re-run `install.sh` anytime on Linux to update.
